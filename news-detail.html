<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var item = (window.ATREYU_NEWS || []).find(function (n) { return n.id === id; });

  var titleEl = document.getElementById('nd-title');
  var dateEl  = document.getElementById('nd-date');
  var bodyEl  = document.getElementById('nd-body');

  if (!item) {
    titleEl.textContent = 'ページが見つかりません';
    dateEl.textContent = '';
    bodyEl.innerHTML = '<p>お探しのニュースは見つかりませんでした。<a href="news.html">NEWS一覧</a>からご確認ください。</p>';
    return;
  }

  document.title = item.title + ' | Atreyu NEWS';
  titleEl.textContent = item.title;
  dateEl.textContent = item.date;

  var html = '<p>' + item.body.replace(/\n/g, '<br>') + '</p>';

  if (item.externalUrl) {
    html += '<p style="margin-top:32px">'
          + '<a href="' + item.externalUrl + '" target="_blank" rel="noopener" class="btn btn--ghost">'
          + (item.externalLabel || '詳細を見る') + ' ↗</a>'
          + '</p>';
  }

  bodyEl.innerHTML = html;
})();
</script>
