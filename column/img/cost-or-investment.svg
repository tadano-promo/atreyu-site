<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" role="img" aria-labelledby="t d">
  <title id="t">「制作費」として払う道と、「投資」として払う道</title>
  <desc id="d">左：「動画がほしい」→ きれいな動画ができあがる → ……それで？（ここで止まる）。右：「困りごとがある」→ 解き方を決める → そのための動画をつくる → 困りごとが動いたか見る。</desc>
  <defs>
    <style>
      .ln{fill:none;stroke:#b8895a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#faf6ee;stroke:#b8895a;stroke-width:1.6}
      .dash{stroke-dasharray:5 5}
      .s{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:22px;fill:#4a2c10}
      .cap{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:23px;fill:#7a4f2e;letter-spacing:.05em}
    </style>
  </defs>
  <text class="cap" x="165.0" y="42" text-anchor="middle">「制作費」として払う</text>
  <rect class="box" x="20" y="70" width="290" height="64" rx="2"/>
  <text class="s" x="165.0" y="110.0" text-anchor="middle">「動画がほしい」</text>
  <path class="ln" d="M165.0 134 V160 M157.0 152 L165.0 160 L173.0 152"/>
  <rect class="box" x="20" y="164" width="290" height="86" rx="2"/>
  <text class="s" x="165.0" y="200" text-anchor="middle">きれいな動画が</text>
  <text class="s" x="165.0" y="228" text-anchor="middle">できあがる</text>
  <path class="ln" d="M165.0 250 V276 M157.0 268 L165.0 276 L173.0 268"/>
  <rect class="box dash" x="20" y="280" width="290" height="64" rx="2"/>
  <text class="s" x="165.0" y="320.0" text-anchor="middle">……それで？</text>
  <text class="cap" x="475.0" y="42" text-anchor="middle">「投資」として払う</text>
  <rect class="box" x="330" y="70" width="290" height="64" rx="2"/>
  <text class="s" x="475.0" y="110.0" text-anchor="middle">「困りごとがある」</text>
  <path class="ln" d="M475.0 134 V160 M467.0 152 L475.0 160 L483.0 152"/>
  <rect class="box" x="330" y="164" width="290" height="64" rx="2"/>
  <text class="s" x="475.0" y="204.0" text-anchor="middle">解き方を決める</text>
  <path class="ln" d="M475.0 228 V254 M467.0 246 L475.0 254 L483.0 246"/>
  <rect class="box" x="330" y="258" width="290" height="86" rx="2"/>
  <text class="s" x="475.0" y="294" text-anchor="middle">そのための動画を</text>
  <text class="s" x="475.0" y="322" text-anchor="middle">つくる</text>
  <path class="ln" d="M475.0 344 V370 M467.0 362 L475.0 370 L483.0 362"/>
  <rect class="box" x="330" y="374" width="290" height="86" rx="2"/>
  <text class="s" x="475.0" y="410" text-anchor="middle">困りごとが</text>
  <text class="s" x="475.0" y="438" text-anchor="middle">動いたか見る</text>
  <path class="ln dash" d="M320.0 60 V470"/>
</svg>
